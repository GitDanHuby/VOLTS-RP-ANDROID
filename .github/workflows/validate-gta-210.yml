name: Validate GTA 2.10 migration

on:
  workflow_dispatch:
  push:
    branches:
      - teste-samp-2.10

concurrency:
  group: gta-210-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK and CMake
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VOLTS-RP-GTA-2.10-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
